name: App CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  sanity:
    name: Typecheck + Tests + Release Config + Web Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --runInBand --ci

      - name: Validate release config baseline
        run: npm run validate:release-config

      - name: Validate release config for beta
        env:
          RELEASE_BUILD: "true"
          EXPO_PUBLIC_API_BASE_URL: https://api.example.com
        run: npm run validate:release-config

      - name: Build web export sanity
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.example.com
        run: npx expo export --platform web --output-dir dist-web-ci
